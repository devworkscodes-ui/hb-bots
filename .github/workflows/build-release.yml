name: Build Hub Bots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build app on Windows
        if: runner.os == 'Windows'
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name HB-Bots
          --collect-all wikipedia --collect-all ddgs --collect-all pynput
          --add-data "robo.py;bots"
          --add-data "bot.v2.py;bots"
          --add-data "bot.v3.py;bots"
          --add-data "botv3.5.py;bots"
          hub_app.py
      - name: Build app on Linux
        if: runner.os == 'Linux'
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name HB-Bots
          --collect-all wikipedia --collect-all ddgs --collect-all pynput
          --add-data "robo.py:bots"
          --add-data "bot.v2.py:bots"
          --add-data "bot.v3.py:bots"
          --add-data "botv3.5.py:bots"
          hub_app.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hb-bots-${{ matrix.name }}
          path: |
            dist/HB-Bots
            dist/HB-Bots.exe
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download app builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: HB Bots ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: release-assets/**/HB-Bots*
          generate_release_notes: true
          overwrite_files: true
